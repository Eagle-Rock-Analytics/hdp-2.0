################################################################################
# HDP-2.0 ParallelCluster Configuration
#
# Storage strategy: NO EFS.
#   pcluster v3 automatically NFS-exports the head node's /home to all compute
#   nodes over the private cluster network. The repo + uv venv live at
#   /home/ec2-user/hdp-2.0/. Compute nodes see it read-only via NFS with no
#   additional EFS cost.
#
#   All persistent data flows through S3 (wecc-historical-wx / cadcat).
#
# Compute: wide spot pool across 6th-7th gen Intel and AMD families.
#   Expanded instance families reduce interruption risk and improve throughput.
#   Capacity-optimized allocation spreads load across multiple pools.
#
# Key pair: neil-caladapt  (~/.ssh/neil-caladapt.pem)
# Profile:  neil.AE  (us-west-2)
# VPC:      hist-obs-vpc (vpc-08796ff94c8ea1659)
################################################################################

Region: us-west-2
Image:
  Os: alinux2023

HeadNode:
  InstanceType: t3.xlarge              # 16 GB RAM — supports large clusters reliably
  Networking:
    SubnetId: subnet-04e4f8ad2973f8917   # hist-obs-vpc / us-west-2a (public)
  Ssh:
    KeyName: neil-caladapt
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonS3FullAccess
  # No SharedStorage block — head-node /home NFS share is automatic and free.

Scheduling:
  Scheduler: slurm
  ScalingStrategy: best-effort        # dispatch to as many nodes as possible immediately
  SlurmSettings:
    ScaledownIdletime: 5              # terminate idle nodes after 5 min (default: 10)
  SlurmQueues:
    - Name: compute
      CapacityType: SPOT
      AllocationStrategy: price-capacity-optimized  # balances low price + low interruption risk
      ComputeResources:
        - Name: spot-4vcpu-8gb
          Instances:
            - InstanceType: c6i.xlarge   # 4 vCPU / 8 GB, 3rd gen Xeon
            - InstanceType: c7i.xlarge   # 4 vCPU / 8 GB, 4th gen Xeon (newer)
            - InstanceType: c6a.xlarge   # 4 vCPU / 8 GB, AMD EPYC
            - InstanceType: c5.xlarge    # 4 vCPU / 8 GB, 2nd gen Xeon (fallback)
            - InstanceType: m6i.xlarge   # 4 vCPU / 16 GB, general purpose
            - InstanceType: m7i.xlarge   # 4 vCPU / 16 GB, 4th gen Xeon gen-purpose
            - InstanceType: m5.xlarge    # 4 vCPU / 16 GB, older gen (availability)
            - InstanceType: t3.xlarge    # 4 vCPU / 16 GB, burstable (fallback)
          MinCount: 0
          MaxCount: 25
        - Name: spot-2vcpu-4gb
          Instances:
            - InstanceType: c6i.large    # 2 vCPU / 4 GB, 3rd gen Xeon
            - InstanceType: c7i.large    # 2 vCPU / 8 GB, 4th gen Xeon (newer)
            - InstanceType: c6a.large    # 2 vCPU / 4 GB, AMD EPYC
            - InstanceType: c5a.large    # 2 vCPU / 4 GB, AMD EPYC (older)
            - InstanceType: c5.large     # 2 vCPU / 4 GB, 2nd gen Xeon (fallback)
            - InstanceType: m6i.large    # 2 vCPU / 16 GB, general purpose
            - InstanceType: m7i.large    # 2 vCPU / 16 GB, 4th gen Xeon gen-purpose
            - InstanceType: m5.large     # 2 vCPU / 8 GB, older gen (availability)
            - InstanceType: t3.large     # 2 vCPU / 8 GB, burstable (fallback)
          MinCount: 0
          MaxCount: 25
      Networking:
        # Spread across all four AZs so Spot capacity is available
        SubnetIds:
          - subnet-04e4f8ad2973f8917   # us-west-2a
          - subnet-0781de388d07e8c93   # us-west-2b
          - subnet-0e0c9eeec2189e556   # us-west-2c
          - subnet-0930d529ca5bec184   # us-west-2d
        PlacementGroup:
          Enabled: false   # must be false when spanning multiple AZs
      Iam:
        AdditionalIamPolicies:
          - Policy: arn:aws:iam::aws:policy/AmazonS3FullAccess
